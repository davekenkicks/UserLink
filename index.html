<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UserLink - Find their socials. All in one place.</title>
  <meta name="description" content="Enter a username to explore public profiles across various platforms.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <a class="brand__logo" href="#" aria-label="UserLink home">
        <span class="brand__mark"><i class="icon fa-solid fa-at" aria-hidden="true"></i></span>
        <span class="brand__name">UserLink</span>
      </a>
    </div>
    <a class="privacy-badge" href="#privacy">
      <i class="icon fa-solid fa-shield-halved" aria-hidden="true"></i>
      Privacy first
    </a>
  </header>

  <main>
    <section class="hero">
      <p class="hero__eyebrow">A little less searching. A lot more connecting.</p>
      <h1 class="hero__title">Find their socials. All in one place.</h1>
      <p class="hero__subtitle">Enter a username to explore public profiles across your favorite platforms.</p>

      <form class="search" role="search">
        <label class="visually-hidden" for="username">Username</label>
        <input class="search__input" id="username" name="username" type="text"
               placeholder="type username here"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="button" type="submit">
          <i class="icon fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          Find accounts
        </button>
      </form>
    </section>

    <section class="results">
      
    </section>
  </main>

  <footer class="site-footer">
    <div>
      <div class="site-footer__brand">
        <span class="site-footer__name">UserLink</span>
        <span>A simpler way to find your people.</span>
      </div>
      <p class="site-footer__note">Public profiles only. Always.</p>
    </div>
    <nav class="site-footer__nav" aria-label="Footer">
      <a href="#about">About</a>
      <a href="#privacy">Privacy</a>
      <a href="#contact">Get in touch</a>
    </nav>
  </footer>

<script src="script.js"></script>
</body>
</html>
